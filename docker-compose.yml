services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devcenter
      POSTGRES_PASSWORD: devcenter
      POSTGRES_DB: devcenter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcenter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://devcenter:devcenter@postgres:5432/devcenter
      DIRECT_URL: postgresql://devcenter:devcenter@postgres:5432/devcenter
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
